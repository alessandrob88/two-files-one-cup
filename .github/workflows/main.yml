name: Main Workflow

on:
  repository_dispatch:
    types: [start_script]

concurrency:
  group: cup-marche-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Run scraper
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CODICE_FISCALE: ${{ secrets.CODICE_FISCALE }}
          NRE: ${{ secrets.NRE }}
        run: node index.js

      - name: Persist scraper state
        if: success()
        run: |
          if ! git status --porcelain -- .last-result.sha256 | grep -q .; then
            echo 'Risultato invariato: nessuno stato da salvare.'
            exit 0
          fi
          printf 'Ultima esecuzione: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > last_execution.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .last-result.sha256 last_execution.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: persist scraper state'
          git push
